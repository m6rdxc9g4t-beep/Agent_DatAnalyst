[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atelier-datanalyst"
version = "0.1.0"
description = "Agent_DatAnalyst : extension d'Atelier Nexus (Convert, Viz, Tab, Projets, Trésorerie)."
readme = "README.md"
requires-python = ">=3.12"
# S'exécute DANS le backend d'Atelier Nexus : httpx, pydantic et pydantic-settings viennent de lui.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["atelier_datanalyst"]
known-third-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["atelier_datanalyst"]
